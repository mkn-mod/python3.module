
name: python3.module
version: master

parent: base
src: mod.cpp
mode: shared

profile:
- name: base
  dep: mkn.mod
  if_arg:
      win_static: -DYAML_CPP_STATIC_DEFINE
      shared: -DMKN_KUL_SHARED

- name: test_module
  dep: lang.pybind11
  src: test_module.cpp
  mod: python3.module lang.python3
  out: test_module
  install: .

- name: format
  mod: |
    clang.format{init{style: file, paths: .}}
