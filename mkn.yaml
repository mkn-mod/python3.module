
name: python3.module
property:
  # dependency versions: master on master (not the default branch: mkn.mod's is
  #  the rolling latest, whose mkn.kul differs from a master project's)
  mkn.mod.version: latest
version: master

parent: base
src: mod.cpp
mode: shared

profile:
- name: base
  dep: mkn.mod#${mkn.mod.version}
  if_arg:
    shared: -DMKN_KUL_SHARED

- name: test_module
  dep: lang.pybind11
  src: test_module.cpp
  mod: python3.module#latest lang.python3#latest
  out: test_module
  install: .
  mode: shared

- name: format
  mod: |
    clang.format#latest{init{style: file, paths: .}}
