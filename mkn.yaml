
name: python3.module
version: master

parent: base
src: mod.cpp
mode: shared

profile:
- name: base
  dep: mkn.mod
  if_dep:
    bsd: parse.yaml[lib]
    win: parse.yaml[lib]
  if_arg:
    shared: -DMKN_KUL_SHARED
    win: -DYAML_CPP_STATIC_DEFINE

- name: test_module
  dep: lang.pybind11
  src: test_module.cpp
  mod: python3.module lang.python3
  out: test_module
  install: .
  mode: shared
  if_arg:
    win: -DYAML_CPP_STATIC_DEFINE

- name: format
  mod: |
    clang.format{init{style: file, paths: .}}
